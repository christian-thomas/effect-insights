name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (admin / banner / edge / types)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint + typecheck across the workspace
        run: bun run check

      - name: Unit tests (vitest + cloudflare:vitest-pool-workers)
        run: bun run test

      - name: Install Playwright browsers
        run: bun --filter @tracewatch/banner run test:e2e:install

      - name: Build banner bundle for e2e
        run: bun --filter @tracewatch/banner run build

      - name: Banner Playwright e2e (incl. axe-core)
        run: bun --filter @tracewatch/banner run test:e2e

  php:
    name: Laravel (apps/api)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
          extensions: mbstring, sqlite3, pdo_sqlite, intl, bcmath

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (Pint) + Rector + PHPStan
        run: composer check

      - name: PHPUnit
        run: php artisan test
