name = "effect-cmp-config"
main = "src/config-worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Banner config delivery + cmp.js bundle proxy.
# Populate these via `wrangler kv namespace create`, `wrangler r2 bucket create`,
# then paste the resulting IDs.

# [[kv_namespaces]]
# binding = "BANNER_CONFIGS"
# id = "<paste-from-wrangler-kv-namespace-create>"

# [[r2_buckets]]
# binding = "BUNDLES"
# bucket_name = "effect-cmp-bundles"

[vars]
ENVIRONMENT = "production"

# BANNER_CONFIG_SIGNING_KEY is set via
# `wrangler secret put BANNER_CONFIG_SIGNING_KEY --config wrangler.config.toml`
# and must match the BANNER_CONFIG_SIGNING_KEY env var Laravel signs with.
# Generate via `openssl rand -hex 32`.

# Map your zone to assets.effectcmp.com once DNS is set up:
# routes = [
#   { pattern = "assets.effectcmp.com/config/*", custom_domain = true },
#   { pattern = "assets.effectcmp.com/loader.js", custom_domain = true },
#   { pattern = "assets.effectcmp.com/cmp.*.js", custom_domain = true }
# ]
