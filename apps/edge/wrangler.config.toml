name = "effectinsight-config"
main = "src/config-worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Banner config delivery + cmp.js bundle proxy.
# Populate these via `wrangler kv namespace create`, `wrangler r2 bucket create`,
# then paste the resulting IDs.

[[kv_namespaces]]
binding = "BANNER_CONFIGS"
id = "057930c0d05f44168452b43ceb180816"

[[r2_buckets]]
binding = "BUNDLES"
bucket_name = "effectinsight-bundles"

[vars]
ENVIRONMENT = "production"

# BANNER_CONFIG_SIGNING_KEY is set via
# `wrangler secret put BANNER_CONFIG_SIGNING_KEY --config wrangler.config.toml`
# and must match the BANNER_CONFIG_SIGNING_KEY env var Laravel signs with.
# Generate via `openssl rand -hex 32`.

# Map your zone to assets.effectinsight.com once DNS is set up:
# routes = [
#   { pattern = "assets.effectinsight.com/config/*", custom_domain = true },
#   { pattern = "assets.effectinsight.com/loader.js", custom_domain = true },
#   { pattern = "assets.effectinsight.com/cmp.*.js", custom_domain = true }
# ]
