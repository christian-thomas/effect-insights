name = "tracewatch-scanner"
main = "src/scanner-worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Text-import rule so `import axeSource from 'axe-core/axe.min.js'`
# resolves to the source as a string at build time. Without this rule,
# Wrangler tries to evaluate the file as a JS module and chokes on
# axe-core's UMD wrapper. fallthrough = false stops esbuild from
# also bundling the file the normal way after the rule has claimed it.
[[rules]]
type = "Text"
globs = ["**/*.min.js"]
fallthrough = false

[observability]
enabled = true

[vars]
ENVIRONMENT = "production"

# CF Browser Rendering binding. Available on the paid Workers + Browser
# Rendering plan. The binding name BROWSER is what the worker code reads via
# `c.env.BROWSER` when calling `puppeteer.launch()`.
[browser]
binding = "BROWSER"

# SCANNER_SECRET is set via `wrangler secret put SCANNER_SECRET` rather than
# [vars] — it must match the SCANNER_WORKER_SECRET env var on the Laravel side.
# Generate with `openssl rand -hex 32`.

# [routes]
# pattern = "scanner.tracewatch.io/*"
# custom_domain = true
